<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex,nofollow">
<title>momanga - 漫画ビューア</title>
<link rel="icon" href="/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="/style.css?v=2">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="/" class="brand" aria-label="momanga">
      <img src="/logo.png" alt="momanga" class="brand-logo">
      <span class="brand-text">momanga</span>
    </a>
    <form id="search-form" class="search-form" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" id="search-input" class="search-input"
             placeholder="漫画を検索... (例: 幼なじみ)" aria-label="検索">
      <kbd class="search-kbd">/</kbd>
    </form>
    <div class="header-controls">
      <div class="segmented" role="tablist" aria-label="ソース">
        <button type="button" class="seg-btn active" data-source="all">すべて</button>
        <button type="button" class="seg-btn" data-source="momonga">momon-ga</button>
        <button type="button" class="seg-btn" data-source="hitomi">hitomi</button>
      </div>
      <div class="segmented" role="tablist" aria-label="言語">
        <button type="button" class="seg-btn active" data-lang="all">全言語</button>
        <button type="button" class="seg-btn" data-lang="ja">日本語</button>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div id="status-bar" class="status-bar" hidden></div>

  <section class="grid-section">
    <h2 id="page-title" class="section-title">新着</h2>
    <div id="card-grid" class="card-grid" aria-live="polite"></div>
    <div id="loading-area" class="loading-area" hidden>
      <div class="spinner"></div>
      <span>読み込み中...</span>
    </div>
    <div id="load-more-area" class="load-more-area" hidden>
      <button id="load-more-btn" class="load-more-btn" type="button">もっと見る</button>
    </div>
    <div id="empty-state" class="empty-state" hidden>
      <p>漫画が見つかりませんでした。</p>
      <p class="hint">別のキーワードで検索するか、ソースと言語を切り替えてみてください。</p>
    </div>
  </section>
</main>

<!-- 詳細モーダル -->
<div id="gallery-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-header">
    <div class="modal-title-wrap">
      <h2 id="modal-title" class="modal-title"></h2>
      <div id="modal-meta" class="modal-meta"></div>
    </div>
    <div class="modal-actions">
      <button type="button" id="bookmark-btn" class="modal-btn" title="ブックマーク">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
      <button type="button" id="fullscreen-btn" class="modal-btn" title="全画面">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path>
        </svg>
      </button>
      <button type="button" id="modal-close" class="modal-btn" title="閉じる (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
  <div id="modal-pages" class="modal-pages"></div>
  <div class="modal-nav">
    <button type="button" id="prev-page-btn" class="nav-btn" title="前のページ (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <span id="page-indicator" class="page-indicator">1 / 1</span>
    <button type="button" id="next-page-btn" class="nav-btn" title="次のページ (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>
</div>

<!-- トップへ戻る -->
<button type="button" id="top-btn" class="top-btn" title="トップへ (G)" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="19" x2="12" y2="5"></line>
    <polyline points="5 12 12 5 19 12"></polyline>
  </svg>
</button>

<script src="/app.js?v=2" defer></script>
</body>
</html>
